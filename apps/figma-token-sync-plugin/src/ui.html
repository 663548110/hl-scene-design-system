<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Figma Token Sync</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        max-width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        background:
          radial-gradient(circle at top right, color-mix(in srgb, var(--figma-color-bg-brand, #0d99ff) 12%, transparent), transparent 28%),
          linear-gradient(180deg, var(--figma-color-bg) 0%, color-mix(in srgb, var(--figma-color-bg) 92%, var(--figma-color-bg-secondary) 8%) 100%);
        color: var(--figma-color-text);
        font: 12px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        padding: 12px;
      }

      .shell {
        display: grid;
        gap: 10px;
        width: 100%;
        max-width: 396px;
        margin: 0 auto;
      }

      .hero {
        padding: 10px 12px;
        border: 1px solid var(--figma-color-border);
        border-radius: 14px;
        background:
          linear-gradient(135deg, color-mix(in srgb, var(--figma-color-bg-brand, #0d99ff) 14%, transparent), transparent 42%),
          var(--figma-color-bg-secondary);
      }

      .hero-title {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }

      .hero-subtitle {
        margin: 3px 0 0;
        color: var(--figma-color-text-secondary);
        font-size: 11px;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      .stat {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
        padding: 4px 8px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--figma-color-bg) 70%, transparent);
        border: 1px solid color-mix(in srgb, var(--figma-color-border) 64%, transparent);
      }

      .stat-label {
        color: var(--figma-color-text-secondary);
        font-size: 11px;
      }

      .stat-value {
        font-size: 12px;
        font-weight: 700;
      }

      .panel {
        padding: 12px;
        border: 1px solid var(--figma-color-border);
        border-radius: 14px;
        background: var(--figma-color-bg);
      }

      .panel-title {
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 700;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--figma-color-text-secondary);
      }

      input,
      select,
      textarea,
      button {
        font: inherit;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 9px 10px;
        border-radius: 10px;
        border: 1px solid var(--figma-color-border);
        background: var(--figma-color-bg-secondary);
        color: var(--figma-color-text);
        outline: none;
      }

      textarea {
        min-height: 72px;
        resize: vertical;
      }

      input[type="checkbox"] {
        width: auto;
        accent-color: var(--figma-color-bg-brand);
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--figma-color-border-brand-strong);
        box-shadow: 0 0 0 1px var(--figma-color-border-brand-strong);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .theme-picker {
        margin-top: 0;
      }

      .theme-picker-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }

      .theme-picker-title {
        color: var(--figma-color-text-secondary);
        font-weight: 700;
      }

      .theme-picker-actions {
        display: flex;
        gap: 6px;
      }

      .theme-picker-actions button {
        padding: 4px 9px;
        font-size: 11px;
      }

      .theme-list {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
        max-height: 260px;
        overflow: auto;
      }

      .theme-option {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 9px;
        border-radius: 12px;
        border: 1px solid var(--figma-color-border);
        background:
          linear-gradient(135deg, color-mix(in srgb, var(--theme-preview-color, #8a8a8a) 12%, transparent), transparent 44%),
          var(--figma-color-bg-secondary);
        color: var(--figma-color-text);
        min-width: 0;
      }

      .theme-option.is-selected {
        border-color: color-mix(in srgb, var(--theme-preview-color, #8a8a8a) 70%, var(--figma-color-border));
        box-shadow: inset 3px 0 0 var(--theme-preview-color, #8a8a8a);
      }

      .theme-option input[type="checkbox"] {
        flex: 0 0 auto;
      }

      .theme-option-swatch {
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: var(--theme-preview-color, #8a8a8a);
        border: 2px solid color-mix(in srgb, white 74%, var(--theme-preview-color, #8a8a8a));
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--theme-preview-color, #8a8a8a) 48%, var(--figma-color-border));
      }

      .theme-option-body {
        display: flex;
        align-items: center;
        min-width: 0;
      }

      .theme-option-name {
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .theme-list-empty {
        color: var(--figma-color-text-secondary);
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      .theme-list-empty {
        grid-column: 1 / -1;
        padding: 9px 10px;
        border-radius: 12px;
        border: 1px dashed var(--figma-color-border);
      }

      button {
        padding: 9px 12px;
        border-radius: 999px;
        border: 1px solid var(--figma-color-border);
        background: var(--figma-color-bg-secondary);
        color: var(--figma-color-text);
        cursor: pointer;
        transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        border-color: var(--figma-color-border-brand-strong);
      }

      button.primary {
        border-color: var(--figma-color-border-brand-strong);
        background: var(--figma-color-bg-brand);
        color: var(--figma-color-text-onbrand);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
        transform: none;
      }

      .status {
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--figma-color-border);
        background: var(--figma-color-bg-secondary);
        color: var(--figma-color-text-secondary);
      }

      .status.success {
        border-color: color-mix(in srgb, #14ae5c 45%, var(--figma-color-border));
        color: #14ae5c;
      }

      .status.error {
        border-color: color-mix(in srgb, #f24822 45%, var(--figma-color-border));
        color: #f24822;
      }

      .sync-log-shell {
        margin-top: 8px;
      }

      .sync-log-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }

      .sync-log-title {
        color: var(--figma-color-text-secondary);
        font-weight: 700;
      }

      .sync-log-actions {
        display: flex;
        gap: 6px;
      }

      .sync-log-actions button {
        padding: 4px 9px;
        font-size: 11px;
      }

      .sync-log {
        min-height: 118px;
        max-height: 172px;
        overflow: auto;
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid var(--figma-color-border);
        background: color-mix(in srgb, var(--figma-color-bg-secondary) 88%, black 12%);
        font: 11px/1.55 "SFMono-Regular", ui-monospace, Menlo, monospace;
      }

      .sync-log-row {
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr);
        gap: 8px;
        padding: 4px 0;
        border-bottom: 1px solid color-mix(in srgb, var(--figma-color-border) 48%, transparent);
      }

      .sync-log-row:last-child {
        border-bottom: 0;
      }

      .sync-log-time {
        color: var(--figma-color-text-tertiary);
      }

      .sync-log-message {
        color: var(--figma-color-text-secondary);
        overflow-wrap: anywhere;
      }

      .sync-log-row.success .sync-log-message {
        color: #14ae5c;
      }

      .sync-log-row.warning .sync-log-message {
        color: #f3b63f;
      }

      .sync-log-row.error .sync-log-message {
        color: #f24822;
      }

      .sync-log-empty {
        color: var(--figma-color-text-tertiary);
      }

      .preview {
        min-height: 120px;
        max-height: 240px;
        overflow: auto;
        padding: 14px;
        border-radius: 14px;
        border: 1px solid var(--figma-color-border);
        background: color-mix(in srgb, var(--figma-color-bg-secondary) 84%, black 16%);
        color: #f6f7f9;
        font: 12px/1.55 "SFMono-Regular", ui-monospace, Menlo, monospace;
        white-space: pre-wrap;
      }

      .hint {
        margin-top: 10px;
        color: var(--figma-color-text-secondary);
      }

      .settings-details,
      .sync-log-details,
      .preview-details {
        margin-top: 12px;
      }

      .settings-details summary,
      .sync-log-details summary,
      .preview-details summary {
        cursor: pointer;
        color: var(--figma-color-text-secondary);
        font-weight: 700;
        user-select: none;
      }

      .settings-details summary:hover,
      .sync-log-details summary:hover,
      .preview-details summary:hover {
        color: var(--figma-color-text);
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="hero">
        <h1 class="hero-title">Figma Token Sync</h1>
        <p class="hero-subtitle">Variables -> CSS / Flutter 主题文件</p>
        <div class="stats">
          <div class="stat">
            <span class="stat-label">集合</span>
            <div class="stat-value" id="collection-count">0</div>
          </div>
          <div class="stat">
            <span class="stat-label">全局 Token</span>
            <div class="stat-value" id="token-count">0</div>
          </div>
          <div class="stat">
            <span class="stat-label">警告</span>
            <div class="stat-value" id="warning-count">0</div>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-title">同步主题</h2>
        <div class="theme-picker">
          <div class="theme-picker-header">
            <div class="theme-picker-title">选择主题</div>
            <div class="theme-picker-actions">
              <button id="select-all-themes-button" type="button">全选</button>
              <button id="clear-themes-button" type="button">清空</button>
            </div>
          </div>
          <div id="theme-list" class="theme-list">
            <div class="theme-list-empty">等待识别 Figma 主题...</div>
          </div>
        </div>
        <div class="hint">组件级 token 已自动排除。</div>
      </section>

      <section class="panel">
        <h2 class="panel-title">同步</h2>
        <div class="actions">
          <button id="refresh-button" type="button">刷新 Figma 变量</button>
          <button id="sync-button" class="primary" type="button">同步到 GitHub</button>
        </div>
        <details id="token-details" class="settings-details">
          <summary>GitHub Token 设置</summary>
          <label style="margin-top: 10px">
            Personal Access Token
            <input id="github-token" type="password" placeholder="需要 repo contents 写入权限" />
          </label>
          <div class="actions" style="margin-top: 10px">
            <button id="save-token-button" type="button">保存 Token</button>
            <button id="clear-token-button" type="button">清空 Token</button>
          </div>
          <div class="hint">Token 只保存到本机 Figma 插件存储。</div>
        </details>
        <div id="status" class="status hidden" style="margin-top: 12px"></div>
        <details id="sync-log-details" class="sync-log-details">
          <summary>同步日志</summary>
          <div class="sync-log-shell">
            <div class="sync-log-header">
              <div class="sync-log-title">日志</div>
              <div class="sync-log-actions">
                <button id="copy-log-button" type="button">复制</button>
                <button id="clear-log-button" type="button">清空</button>
              </div>
            </div>
            <div id="sync-log" class="sync-log">
              <div class="sync-log-empty">同步时会显示读取、合并和上传日志。</div>
            </div>
          </div>
        </details>
        <details class="preview-details">
          <summary>查看产物预览</summary>
          <pre id="preview" class="preview" style="margin-top: 10px"></pre>
        </details>
      </section>
    </div>

    <script>
      /* __UI_SCRIPT__ */
    </script>
  </body>
</html>
